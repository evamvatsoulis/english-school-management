services:
  student-service:
    build:
      context: ./student_service
      dockerfile: Dockerfile.prod
    container_name: student_service_container
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./student_service/.env

  payment-service:
    build:
      context: ./payment_service
      dockerfile: Dockerfile.prod
    container_name: payment_service_container
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./payment_service/.env

  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile.prod
    container_name: auth_service_container
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./auth_service/.env

  class-service:
    build:
      context: ./class_service
      dockerfile: Dockerfile.prod
    container_name: class_service_container
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./class_service/.env

  notification-service:
    build:
      context: ./notification_service
      dockerfile: Dockerfile.prod
    container_name: notification_service_container
    restart: unless-stopped
    env_file:
      - ./notification_service/.env

  export-service:
    build:
      context: ./export_service
      dockerfile: Dockerfile.prod
    container_name: export_service_container
    restart: unless-stopped
    env_file:
      - ./export_service/.env

  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile.prod
    container_name: api_gateway_container
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./api_gateway/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: frontend_container
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env

  postgres:
    image: postgres:15-alpine
    container_name: postgres_container
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: